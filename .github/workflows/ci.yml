name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}${{ matrix.vtk != 'latest' && format(' (VTK {0})', matrix.vtk) || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12", "3.13"]
        vtk: ["latest"]
        include:
          - os: windows-latest
            python-version: "3.12"
            vtk: "latest"
          - os: macos-latest
            python-version: "3.12"
            vtk: "latest"
          # VTK version of the current 3D Slicer release (the same pin as in slicerheart_4dflow),
          # the environment the Baffle Planner will call this library from
          - os: ubuntu-latest
            python-version: "3.12"
            vtk: "9.6.2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" ${{ matrix.vtk != 'latest' && format('vtk=={0}', matrix.vtk) || '' }}

      - name: Run tests
        run: python -m pytest -v --durations=10

      # the metrics recorded on this platform, to compare with the baseline and other platforms by hand
      - name: Upload recorded metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-py${{ matrix.python-version }}-${{ matrix.os }}${{ matrix.vtk != 'latest' && format('-vtk{0}', matrix.vtk) || '' }}
          path: .test-reports/latest.json
          retention-days: 14

  benchmark-smoke:
    name: Quick benchmark (6 shapes x 4 methods)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run the quick benchmark (report.md + report.pdf)
        run: python scripts/run_benchmark.py --out output/benchmark_quick --quick
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-quick
          path: |
            output/benchmark_quick/report.md
            output/benchmark_quick/report.pdf
            output/benchmark_quick/eval/*.csv
          retention-days: 14
