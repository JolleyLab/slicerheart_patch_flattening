name: generate-dataset

# Generates the synthetic baffle dataset (neural/DATASET.md) on GitHub runners:
#   geometry shards: n_shards x n_per_shard samples with ARAP/LSCM labels (~1 h per 10k on a 4-core runner)
#   physics shards:  n_physics samples with inflated states at 2 pressures x 2 materials (~7 s/sample/core)
# and attaches the shard zips to the release named in `release_tag` (created if missing).

on:
  workflow_dispatch:
    inputs:
      n_shards:
        description: "number of geometry shards"
        default: "10"
      n_per_shard:
        description: "samples per geometry shard"
        default: "10000"
      n_physics:
        description: "samples per physics shard (0 to skip)"
        default: "2500"
      n_physics_shards:
        description: "number of physics shards"
        default: "2"
      release_tag:
        description: "release to attach the shards to"
        default: "dataset-v1"

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      geom: ${{ steps.m.outputs.geom }}
      phys: ${{ steps.m.outputs.phys }}
    steps:
      - id: m
        run: |
          python3 -c "import json; print('geom=' + json.dumps(list(range(int('${{ inputs.n_shards }}')))))" >> "$GITHUB_OUTPUT"
          python3 -c "import json; n=int('${{ inputs.n_physics }}'); print('phys=' + json.dumps(list(range(int('${{ inputs.n_physics_shards }}'))) if n > 0 else []))" >> "$GITHUB_OUTPUT"

  geometry:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.geom) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[physics]"
      - name: Generate shard
        run: python scripts/generate_dataset.py --out output/dataset --shard ${{ matrix.shard }} --n ${{ inputs.n_per_shard }} --workers 4 --zip
      - uses: actions/upload-artifact@v4
        with:
          name: shard-geometry-${{ matrix.shard }}
          path: output/dataset/shard_*.zip
          retention-days: 30

  physics:
    needs: plan
    if: ${{ needs.plan.outputs.phys != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.phys) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[physics]"
      - name: Generate physics shard
        run: python scripts/generate_dataset.py --out output/dataset --shard ${{ matrix.shard }} --n ${{ inputs.n_physics }} --workers 4 --physics --zip
      - uses: actions/upload-artifact@v4
        with:
          name: shard-physics-${{ matrix.shard }}
          path: output/dataset/shard_*_physics.zip
          retention-days: 30

  publish:
    needs: [geometry, physics]
    if: ${{ always() && needs.geometry.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: shards
          merge-multiple: true
      - name: Checksums and manifest
        run: |
          cd shards && ls -la && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
          cp ../slicerheart_patch_flattening/neural/DATASET.md .
      - name: Create or update release and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.release_tag }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Synthetic baffle dataset $TAG" \
            --notes "Generated by the generate-dataset workflow from commit ${GITHUB_SHA}. Record format and provenance: DATASET.md (attached). Shards are reproducible from their seeds (manifest.json inside each zip)." --prerelease
          gh release upload "$TAG" shards/*.zip shards/SHA256SUMS.txt shards/DATASET.md --clobber
