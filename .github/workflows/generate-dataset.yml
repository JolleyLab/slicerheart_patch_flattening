name: generate-dataset

# Generates dataset v1 (see neural/DATASET.md): geometry shards of n_per_shard samples each and
# physics-labelled shards, as GitHub Actions jobs in parallel, and attaches the zips to the
# release named by `release_tag` (created if missing). Each shard is reproducible from its seed.

on:
  workflow_dispatch:
    inputs:
      n_shards:
        description: "number of geometry shards"
        default: "10"
      n_per_shard:
        description: "samples per geometry shard"
        default: "10000"
      physics_shards:
        description: "number of physics-labelled shards"
        default: "2"
      physics_per_shard:
        description: "samples per physics shard (2 pressures x 2 materials each)"
        default: "2500"
      release_tag:
        description: "release to attach the shards to"
        default: "dataset-v1"

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      geom: ${{ steps.m.outputs.geom }}
      phys: ${{ steps.m.outputs.phys }}
    steps:
      - id: m
        run: |
          python3 -c "import json,os; n=int('${{ inputs.n_shards }}'); print('geom='+json.dumps(list(range(n))))" >> $GITHUB_OUTPUT
          python3 -c "import json,os; n=int('${{ inputs.physics_shards }}'); print('phys='+json.dumps(list(range(n))))" >> $GITHUB_OUTPUT

  geometry:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.geom) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[physics]"
      - run: python scripts/generate_dataset.py --out output/dataset --shard ${{ matrix.shard }} --n ${{ inputs.n_per_shard }} --workers 4 --zip
      - uses: actions/upload-artifact@v4
        with:
          name: shard_${{ matrix.shard }}
          path: output/dataset/shard_*.zip
          retention-days: 7

  physics:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.phys) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[physics]"
      - run: python scripts/generate_dataset.py --out output/dataset --shard ${{ matrix.shard }} --n ${{ inputs.physics_per_shard }} --workers 4 --physics --zip
      - uses: actions/upload-artifact@v4
        with:
          name: physics_shard_${{ matrix.shard }}
          path: output/dataset/shard_*_physics.zip
          retention-days: 7

  release:
    needs: [geometry, physics]
    if: always() && (needs.geometry.result == 'success' || needs.physics.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: shards, merge-multiple: true }
      - name: Attach shards to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la shards
          gh release view "${{ inputs.release_tag }}" >/dev/null 2>&1 || \
            gh release create "${{ inputs.release_tag }}" --title "Synthetic baffle dataset v1" \
              --notes "Generated by the generate-dataset workflow from commit ${GITHUB_SHA}. Record format and intended use: slicerheart_patch_flattening/neural/DATASET.md; training path and roadmap: reports/05_roadmap_inverse_surrogate.md. Each shard is reproducible from its manifest seed with scripts/generate_dataset.py."
          gh release upload "${{ inputs.release_tag }}" shards/*.zip --clobber
