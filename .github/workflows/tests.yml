name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ref,dev,physics]"
      - name: Unit tests
        run: python -m pytest -q tests --durations=10
      - name: Quick benchmark smoke run (6 shapes x 4 methods, report.md + report.pdf)
        run: python scripts/run_benchmark.py --out output/benchmark_quick --quick
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-quick-py${{ matrix.python-version }}
          path: |
            output/benchmark_quick/report.md
            output/benchmark_quick/report.pdf
            output/benchmark_quick/eval/*.csv
          retention-days: 14
